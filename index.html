<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5S Floor Scan</title>
<style>
  :root{--brand:#1f6feb;--bg:#0e1320;--card:#fff;--line:#dde3ec;--txt:#131b2a;--muted:#66738a;
        --good:#12a150;--warn:#dd9b00;--bad:#d63a3a;--shadow:0 8px 24px rgba(0,0,0,.25)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  .screen{display:none}
  .screen.on{display:block}
  /* start */
  #scr-start{background:linear-gradient(160deg,#132244,#0e1320);min-height:100vh;color:#fff;padding:26px 18px}
  #scr-start .wrap{max-width:560px;margin:0 auto}
  #scr-start h1{margin:6px 0 4px;font-size:26px}
  #scr-start p.sub{margin:0 0 22px;color:#9fb0cc;font-size:14px;line-height:1.5}
  .card{background:#fff;border-radius:16px;padding:18px;color:var(--txt);box-shadow:var(--shadow);margin-bottom:14px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit}
  .btn{width:100%;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-cam{background:linear-gradient(135deg,#1f6feb,#0b57d0);color:#fff;padding:22px;font-size:17px}
  .btn-ghost{background:#e8eefb;color:var(--brand)}
  .btn-good{background:var(--good);color:#fff}
  .btn-soft{background:#eef1f6;color:var(--muted)}
  .btn:disabled{opacity:.55}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .hidden{display:none!important}
  .link{color:#8fb4ff;font-weight:700;cursor:pointer;font-size:13px}
  .banner{font-size:12.5px;border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.45;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#16233f;border:1px solid #24365e;color:#a9c0e6}
  .banner a{color:#fff;font-weight:800;text-decoration:underline;cursor:pointer;white-space:nowrap}
  /* camera */
  #scr-scan{position:relative;height:100vh;background:#000;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .overlayTop{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);color:#fff;z-index:3}
  .pill{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(18,161,80,.7);animation:pulse 1.6s infinite}
  .dot.off{background:var(--warn);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.6)}70%{box-shadow:0 0 0 12px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
  .scanFrame{position:absolute;inset:12% 9%;border:2px solid rgba(255,255,255,.55);border-radius:18px;z-index:2;pointer-events:none}
  .scanFrame .corner{position:absolute;width:34px;height:34px;border:4px solid #fff}
  .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:16px}
  .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:16px}
  .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:16px}
  .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:16px}
  .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#5fd0ff,transparent);animation:scan 2.4s linear infinite;z-index:2;pointer-events:none}
  @keyframes scan{0%{top:12%}50%{top:86%}100%{top:12%}}
  .overlayBottom{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);color:#fff;z-index:3}
  .findToast{background:rgba(12,20,36,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:13px;line-height:1.45;min-height:20px}
  .findToast b{color:#ffd479}
  .countRow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700}
  .chip.high{background:rgba(214,58,58,.85)}.chip.critical{background:rgba(120,0,0,.95)}.chip.medium{background:rgba(221,155,0,.85)}.chip.low{background:rgba(31,111,235,.85)}
  .ctrls{display:flex;gap:10px}
  .ctrls .btn{padding:15px;font-size:15px}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .75s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* report */
  #scr-report{background:#eef1f6;min-height:100vh;padding:16px}
  #scr-report .wrap{max-width:820px;margin:0 auto}
  .rep{background:#fff;border-radius:16px;padding:26px;box-shadow:var(--shadow);margin-bottom:14px}
  .repHead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
  .repHead h1{margin:0;font-size:22px}
  .repHead .meta{color:var(--muted);font-size:13px;line-height:1.6;text-align:right}
  .bigScore{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 18px}
  .bigScore .num{font-size:58px;font-weight:850;line-height:1}
  .bigScore .num small{font-size:22px;font-weight:700;color:var(--muted)}
  .pillarBlk{margin-bottom:18px}
  .pbar{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:6px}
  .bar{height:12px;border-radius:7px;background:#e2e8f2;overflow:hidden;margin-bottom:9px}
  .bar>span{display:block;height:100%;border-radius:7px}
  .finding{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:#f8fafc;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5}
  .finding.high{border-color:var(--bad)}.finding.critical{border-color:#7a0000;background:#fdecec}.finding.medium{border-color:var(--warn)}.finding.low{border-color:var(--brand)}
  .finding .loc{color:var(--muted);font-size:12px;margin-top:3px}
  .statusBadge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:800;color:#fff}
  .metaRow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .metaPill{background:#eef3fb;border:1px solid #d6e2f6;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700;color:#2b4a80}
  .commentBox{background:#f7f9fc;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:6px}
  .finding .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .finding .act{color:#0b7a41;margin-top:4px}
  .none{color:var(--good);font-size:13.5px;font-weight:600}
  h3{margin:18px 0 8px;font-size:15px}
  .posList{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
  .muted{color:var(--muted);font-size:13px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0c1424;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:999;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media print{
    body{background:#fff}
    #scr-report{padding:0}
    .noPrint{display:none!important}
    .rep{box-shadow:none;border:0;border-radius:0;padding:0 0 14px}
  }
</style>
</head>
<body>

<!-- START -->
<section id="scr-start" class="screen on">
  <div class="wrap">
    <h1>5S Floor Scan</h1>
    <p class="sub">Point your camera at the floor / work area. The AI scans it live, records findings, and builds a 5S report.</p>
    <div id="modeBanner"></div>
    <div class="card">
      <label>Auditor</label>
      <input id="auditor" placeholder="e.g. Sanjeed">
      <label>Zone / Area</label>
      <input id="zone" placeholder="e.g. Line 3 - Packing">
      <label>Scan sensitivity</label>
      <select id="sensitivity">
        <option value="strict">Strict (report every issue)</option>
        <option value="normal" selected>Normal</option>
        <option value="lenient">Lenient (only significant issues)</option>
      </select>
      <div style="height:16px"></div>
      <button class="btn btn-cam" onclick="openCamera()">🎥 Open Camera &amp; Scan</button>
    </div>
    <div class="card">
      <p class="muted" style="margin:0">No camera / desktop? You can still scan a saved photo.</p>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" onclick="document.getElementById('photoInput').click()">Use a photo instead</button>
      <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="scanFromFile(event)">
    </div>
    <div style="text-align:center"><span class="link" onclick="setKey()">AI key settings</span></div>
  </div>
</section>

<!-- SCAN -->
<section id="scr-scan" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <div class="scanFrame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
  <div class="scanline" id="scanline"></div>
  <div class="overlayTop">
    <div><span class="pill"><span class="dot" id="liveDot"></span><span id="scanState">Scanning</span></span></div>
    <div><span class="pill" id="scanCount">0 scans</span></div>
  </div>
  <div class="overlayBottom">
    <div class="countRow" id="countRow"></div>
    <div class="findToast" id="findToast">Starting camera…</div>
    <div class="ctrls">
      <button class="btn btn-ghost" id="autoBtn" onclick="toggleAuto()">Pause</button>
      <button class="btn btn-primary" id="nowBtn" onclick="scanNow()">Scan now</button>
      <button class="btn btn-good" onclick="finish()">Finish &amp; Report</button>
    </div>
  </div>
</section>

<!-- REPORT -->
<section id="scr-report" class="screen">
  <div class="wrap">
    <div class="noPrint" style="display:flex;gap:10px;margin-bottom:14px">
      <button class="btn btn-soft" onclick="resumeScan()">‹ Back to scan</button>
      <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
      <button class="btn btn-ghost" onclick="downloadReport()">Download report</button>
      <button class="btn btn-ghost" onclick="exportCSV()">Findings CSV</button>
    </div>
    <div id="reportBody"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
var LS={cfg:"fs5_config",who:"fs5_who",hist:"fs5_scans"};
var DEFAULT_KEY="";
var DEFAULT_MODEL="gemini-flash-latest";
var PILLARS=["Sort","Set in Order","Shine","Standardize","Sustain"];
var SEV={low:8,medium:16,high:28,critical:40};
var STATUSES=["Excellent","Good","Acceptable","Needs Improvement","Poor"];
var SCAN_INTERVAL=9000;

var cfg=loadJSON(LS.cfg,{key:DEFAULT_KEY,model:DEFAULT_MODEL});
if(!cfg.key)cfg.key=DEFAULT_KEY;
if(!cfg.model||/^gemini-(1\.5|2\.0)/.test(cfg.model))cfg.model=DEFAULT_MODEL;
saveJSON(LS.cfg,cfg);

var stream=null, scanning=false, busy=false, auto=true, timer=null;
var findings=[], positives=[], scanCount=0, startedAt=null, lastOverall=null;
var scoreSamples=[], lastComment="", lastConfidence="", lastStatus="";
function resetState(){ findings=[]; positives=[]; scoreSamples=[]; scanCount=0; startedAt=Date.now(); lastComment=""; lastConfidence=""; lastStatus=""; }

function loadJSON(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function saveJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2800)}
function scCol(p){return p>=80?'var(--good)':p>=50?'var(--warn)':'var(--bad)'}
function screen(n){["start","scan","report"].forEach(function(x){document.getElementById('scr-'+x).classList.toggle('on',x===n)});window.scrollTo(0,0)}

/* ---------- settings ---------- */
function renderBanner(){
  var b=document.getElementById('modeBanner');
  if(cfg.key){b.innerHTML='<span>✓ Live AI scanning is on.</span><a onclick="setKey()">Change</a>';}
  else{b.innerHTML='<span>Demo mode: findings are simulated.</span><a onclick="setKey()">Add AI key</a>';}
}
function setKey(){
  var k=window.prompt('Paste your Gemini API key. Leave blank for demo mode.','');
  if(k===null)return; cfg.key=k.trim(); saveJSON(LS.cfg,cfg); renderBanner(); toast(cfg.key?'Key saved.':'Demo mode on.');
}

/* ---------- camera ---------- */
function openCamera(){
  var a=document.getElementById('auditor').value.trim();
  var z=document.getElementById('zone').value.trim();
  if(!a||!z){toast('Enter auditor and zone.');return}
  saveJSON(LS.who,{auditor:a,zone:z});
  resetState(); auto=true;
  screen('scan'); document.getElementById('scanline').style.display='';
  document.getElementById('autoBtn').textContent='Pause';
  document.getElementById('scanState').textContent='Starting camera…';
  document.getElementById('findToast').textContent='Starting camera…';
  updateCounts();

  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    document.getElementById('scanState').textContent='Camera unsupported';
    document.getElementById('findToast').innerHTML='Camera API not available here. Use "Use a photo instead", or open this page over HTTPS.';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}},audio:false})
    .then(function(s){
      stream=s; var v=document.getElementById('video'); v.srcObject=s;
      v.onloadedmetadata=function(){ document.getElementById('scanState').textContent='Scanning'; };
      return v.play().catch(function(){});
    })
    .then(function(){
      document.getElementById('scanState').textContent='Scanning';
      document.getElementById('findToast').textContent='Camera live. Scanning the floor…';
      startAuto();
    })
    .catch(function(e){
      document.getElementById('scanState').textContent='Camera blocked';
      document.getElementById('findToast').innerHTML='Could not open camera ('+esc(e.message)+'). Use "Use a photo instead", or serve this page over HTTPS and allow camera access.';
    });
}
function startAuto(){ stopAuto(); if(auto){ timer=setInterval(function(){ if(!busy&&!document.hidden) scanNow(); },SCAN_INTERVAL); } }
function stopAuto(){ if(timer){clearInterval(timer);timer=null} }
function toggleAuto(){ auto=!auto; document.getElementById('autoBtn').textContent=auto?'Pause':'Resume'; document.getElementById('liveDot').classList.toggle('off',!auto); document.getElementById('scanState').textContent=auto?'Scanning':'Paused'; if(auto){startAuto();scanNow();}else{stopAuto();} }
function resumeScan(){ screen('scan'); if(stream){ document.getElementById('findToast').textContent='Scanning…'; startAuto(); } }

function grabFrame(){
  var v=document.getElementById('video');
  if(!v.videoWidth) return null;
  var mw=1024, sc=Math.min(1,mw/v.videoWidth), w=Math.round(v.videoWidth*sc), h=Math.round(v.videoHeight*sc);
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(v,0,0,w,h);
  return c.toDataURL('image/jpeg',0.72).split(',')[1];
}

/* ---------- scanning ---------- */
function scanNow(){
  if(busy) return;
  var b64=grabFrame();
  if(!b64){ toast('Camera not ready yet.'); return; }
  runScan(b64);
}
function scanFromFile(e){
  var f=e.target.files&&e.target.files[0]; if(!f)return; e.target.value='';
  var a=document.getElementById('auditor').value.trim()||'Auditor';
  var z=document.getElementById('zone').value.trim()||'Area';
  saveJSON(LS.who,{auditor:a,zone:z});
  resetState(); auto=false;
  screen('scan'); document.getElementById('scanline').style.display='none';
  document.getElementById('scanState').textContent='Photo mode';
  document.getElementById('video').classList.add('hidden');
  var rd=new FileReader();
  rd.onload=function(ev){
    var img=new Image();
    img.onload=function(){
      var mw=1024,sc=Math.min(1,mw/img.width),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
      var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      runScan(c.toDataURL('image/jpeg',0.75).split(',')[1]);
    };
    img.src=ev.target.result;
  };
  rd.readAsDataURL(f);
}

function runScan(b64){
  busy=true;
  var btn=document.getElementById('nowBtn'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Scanning';
  document.getElementById('scanState').textContent='Analysing…';
  analyze(b64).then(function(res){
    scanCount++; lastOverall=res.overall;
    (res.findings||[]).forEach(addFinding);
    (res.positives||[]).forEach(function(p){ if(p&&positives.indexOf(p)<0) positives.push(p); });
    if(res.scores){ var sample={}; PILLARS.forEach(function(p){ sample[p]=parseScore(res.scores[p]); }); scoreSamples.push(sample); }
    if(res.comment) lastComment=res.comment;
    if(res.confidence) lastConfidence=res.confidence;
    if(res.status) lastStatus=res.status;
    updateCounts();
    announce(res);
  }).catch(function(err){
    document.getElementById('findToast').innerHTML='<b style="color:#ff9b9b">Scan error:</b> '+esc(err.message);
  }).then(function(){
    busy=false; btn.disabled=false; btn.textContent='Scan now';
    document.getElementById('scanState').textContent=auto?'Scanning':'Paused';
  });
}

function addFinding(f){
  if(!f||!f.finding) return;
  var sev=normSev(f.severity);
  var key=(f.pillar||'')+'|'+String(f.finding).toLowerCase().trim();
  for(var i=0;i<findings.length;i++){ if(findings[i]._key===key) return; }
  findings.push({_key:key, pillar:PILLARS.indexOf(f.pillar)>=0?f.pillar:'Sort', finding:f.finding, location:f.location||'', severity:sev, evidence:f.evidence||'', action:f.action||''});
}
function normSev(s){ var v=String(s||'').toLowerCase(); return (v==='low'||v==='medium'||v==='high'||v==='critical')?v:'medium'; }
function parseScore(v){ if(v==null) return null; if(typeof v==='number') return (v>=0&&v<=5)?v:null; var s=String(v).trim().toUpperCase(); if(s==='N/A'||s==='NA'||s===''||s==='NONE') return null; var n=parseFloat(s); return (isNaN(n)||n<0||n>5)?null:n; }
function updateCounts(){
  var c={low:0,medium:0,high:0,critical:0}; findings.forEach(function(f){ c[f.severity]=(c[f.severity]||0)+1; });
  document.getElementById('scanCount').textContent=scanCount+' scans';
  document.getElementById('countRow').innerHTML=
    '<span class="chip critical">'+c.critical+' critical</span>'+
    '<span class="chip high">'+c.high+' high</span>'+
    '<span class="chip medium">'+c.medium+' medium</span>'+
    '<span class="chip low">'+c.low+' low</span>';
}
function announce(res){
  var t=document.getElementById('findToast');
  if(res.findings&&res.findings.length){
    var f=res.findings[0];
    t.innerHTML='<b>'+esc(f.pillar)+':</b> '+esc(f.finding)+(f.location?' <span class="muted">('+esc(f.location)+')</span>':'')+(res.findings.length>1?' <span style="color:#9fb0cc">(+'+(res.findings.length-1)+' more)</span>':'');
  } else {
    t.innerHTML='<span style="color:#8ee6b0">No new issues found in this frame.</span>';
  }
}

/* ---------- AI ---------- */
function analyze(b64){
  if(!cfg.key) return Promise.resolve(simulate());
  var known=findings.map(function(f){return '- '+f.pillar+': '+f.finding;}).slice(-15).join('\n');
  var sens=document.getElementById('sensitivity').value;
  var sensitivity = sens==='strict'?'Report every visible issue, including minor ones.':sens==='lenient'?'Report only significant or safety-relevant issues.':'Report clear issues; ignore very minor ones.';

  var lines=[
    'You are a 5S auditor reviewing a live camera frame of a manufacturing workplace floor and surrounding area.',
    '',
    'Check for:',
    '1. Identify unnecessary materials, scrap, waste, empty boxes, unused tools, or abandoned items.',
    '2. Detect materials or objects placed outside their designated location.',
    '3. Detect any object blocking or narrowing a pedestrian walkway.',
    '4. Detect chairs, stools, boxes, containers, or materials placed in walking paths.',
    '5. Detect persons sitting, resting, or remaining stationary in designated walkways.',
    '6. Check whether tools, bins, pallets, containers, and materials are properly arranged.',
    '7. Detect poor stacking, tilted materials, unstable storage, or random placement.',
    '8. Detect materials crossing floor-marked boundaries.',
    '9. Check whether access to machines, electrical panels, fire extinguishers, and emergency exits is clear.',
    '10. Detect dust, dirt, powder, flour, cement dust, oil, grease, liquid, or other contamination on the floor.',
    '11. Detect leakage, product spillage, waste accumulation, or dirty machine surroundings.',
    '12. Check whether floor markings and pedestrian lanes are visible and being followed.',
    '13. Check whether storage areas, parking locations, bins, racks, and materials are properly identified.',
    '14. Detect missing, damaged, faded, or unclear visual markings where visible.',
    '15. Check whether materials are placed within designated storage boundaries.',
    '16. Check whether the workplace appears clean, organized, and free from obvious clutter.',
    '',
    'Rules:',
    '- Treat existing machines, pipelines, structures, fixed equipment, and approved installations in their normal positions as acceptable.',
    '- Do not flag normal fixed items only because they are visible.',
    '- Report only visible abnormalities, misplaced items, unnecessary materials, contamination, obstruction, or non-compliance.',
    '- Do not guess when the image does not provide enough evidence.',
    '- Mark unclear conditions as Not Enough Evidence.',
    '- Classify each finding under Sort, Set in Order, Shine, Standardize, or Sustain.',
    '- Assign severity as Low, Medium, High, or Critical.',
    '- Provide a short recommended corrective action for every detected issue.',
    '- Mention positive 5S practices visible in the image.',
    '- Score each applicable 5S category from 0 to 5.',
    '- Use N/A when a category cannot be judged from the image.',
    '- Classify overall status as Excellent, Good, Acceptable, Needs Improvement, or Poor.',
    '- Return the location of each abnormality, such as left side, right side, near machine, walkway, storage area, or floor.',
    '- Provide a final short management comment summarizing the visible 5S condition.',
    '- Include a confidence level of High, Medium, or Low based on image quality and visibility.',
    '',
    sensitivity,
    (known?'Do NOT repeat these already-found issues:':'') ,
    known,
    '',
    'Return JSON only.'
  ];
  var prompt=lines.join('\n');

  var scoreProp={type:"STRING",description:"Score from 0 to 5, or N/A if this category cannot be judged from the image"};
  var body={contents:[{role:"user",parts:[{text:prompt},{inlineData:{mimeType:"image/jpeg",data:b64}}]}],
    generationConfig:{temperature:0.25,responseMimeType:"application/json",responseSchema:{
      type:"OBJECT",
      properties:{
        findings:{type:"ARRAY",items:{type:"OBJECT",properties:{
          pillar:{type:"STRING",enum:PILLARS},
          finding:{type:"STRING"},
          location:{type:"STRING",description:"e.g. left side, right side, near machine, walkway, storage area, floor"},
          severity:{type:"STRING",enum:["Low","Medium","High","Critical"]},
          evidence:{type:"STRING"},
          action:{type:"STRING"}},required:["pillar","finding","severity"]}},
        positives:{type:"ARRAY",items:{type:"STRING"}},
        scores:{type:"OBJECT",properties:{Sort:scoreProp,"Set in Order":scoreProp,Shine:scoreProp,Standardize:scoreProp,Sustain:scoreProp},required:PILLARS},
        status:{type:"STRING",enum:STATUSES},
        management_comment:{type:"STRING"},
        confidence:{type:"STRING",enum:["High","Medium","Low"]}
      },required:["findings","scores","status","confidence"]}}};

  return geminiWithRetry(body)
    .then(function(j){
      var parts=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts;
      if(!parts)throw new Error('No content returned.');
      var o=JSON.parse(parts.map(function(p){return p.text||''}).join(''));
      return {findings:o.findings||[],positives:o.positives||[],scores:o.scores||null,
              status:o.status||'',comment:o.management_comment||'',confidence:o.confidence||'',overall:null};
    });
}
function geminiCall(model,body){
  var url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(cfg.key);
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(res){return res.text().then(function(t){
      if(!res.ok){ var m=t, retryable=(res.status===429||res.status>=500); try{m=JSON.parse(t).error.message}catch(e){} var err=new Error('Gemini '+res.status+': '+m); err.retryable=retryable; throw err; }
      return JSON.parse(t);
    });});
}
function geminiWithRetry(body){
  var models=[cfg.model,'gemini-flash-lite-latest','gemini-3.5-flash','gemini-flash-latest'].filter(function(m,i,a){return a.indexOf(m)===i});
  var perModel=2, mi=0, tries=0;
  function run(){
    return geminiCall(models[mi],body).catch(function(e){
      if(!e.retryable) throw e;
      tries++;
      if(tries>=perModel){ tries=0; mi++; }
      if(mi>=models.length) throw new Error('All Gemini models are busy right now — try again in a moment.');
      return new Promise(function(r){setTimeout(r,1500)}).then(run);
    });
  }
  return run();
}
var DEMO_FINDINGS=[
 {pillar:"Sort",finding:"Cardboard boxes and unused material stored in the walkway",location:"walkway, right side",severity:"high",evidence:"Boxes on floor near aisle",action:"Remove and red-tag; restore walkway"},
 {pillar:"Set in Order",finding:"Hand tools left on machine bed without a marked location",location:"near machine",severity:"medium",evidence:"Tools on equipment",action:"Provide shadow board / labeled location"},
 {pillar:"Shine",finding:"Oil stain on floor near machine base",location:"floor, near machine",severity:"medium",evidence:"Dark patch on floor",action:"Clean and fix leak source"},
 {pillar:"Standardize",finding:"No visual standard displayed at the workstation",location:"workstation",severity:"low",evidence:"Bare wall at station",action:"Post SWI and photo standard"},
 {pillar:"Sustain",finding:"Cleaning checklist not updated",location:"storage area",severity:"low",evidence:"Old dates",action:"Refresh checklist and audit"}
];
function simulate(){
  var pick=DEMO_FINDINGS[Math.floor(Math.random()*DEMO_FINDINGS.length)];
  function r(){return Math.round((2+Math.random()*3)*10)/10;}
  var sc={Sort:r(),'Set in Order':r(),Shine:r(),Standardize:r(),Sustain:r()};
  return Promise.resolve({findings:[pick],positives:["Floor markings visible near aisle"],
    scores:sc,status:"Good",comment:"Demo mode: sample condition summary. Add an AI key for real analysis.",confidence:"Medium",overall:null});
}

/* ---------- report ---------- */
function categoryScores(){
  var out={};
  PILLARS.forEach(function(p){
    var vals=[]; scoreSamples.forEach(function(sm){ if(typeof sm[p]==='number') vals.push(sm[p]); });
    if(vals.length){
      var avg=vals.reduce(function(a,b){return a+b},0)/vals.length;
      out[p]={score:Math.round(avg*10)/10, pct:Math.round(avg/5*1000)/10, ai:true};
    } else {
      var ded=0,cnt=0; findings.forEach(function(f){ if(f.pillar===p){ ded+=SEV[f.severity]||0; cnt++; } });
      out[p]= cnt>0 ? {score:null, pct:Math.max(0,100-ded), ai:false} : null;
    }
  });
  return out;
}
function statusFor(pct){ return pct>=90?'Excellent':pct>=80?'Good':pct>=70?'Acceptable':pct>=50?'Needs Improvement':'Poor'; }
function statusColor(s){ return s==='Excellent'?'var(--good)':s==='Good'?'#2f9e57':s==='Acceptable'?'var(--warn)':s==='Needs Improvement'?'#e07a1f':'var(--bad)'; }

function finish(){
  stopAuto();
  if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  var cs=categoryScores();
  var applicable=PILLARS.filter(function(p){ return cs[p]; });
  var overall= applicable.length ? Math.round(applicable.reduce(function(a,p){return a+cs[p].pct},0)/applicable.length*10)/10 : 0;
  var status= (overall>0||applicable.length)? statusFor(overall) : 'N/A';
  var who=loadJSON(LS.who,{});

  var dur=startedAt?Math.round((Date.now()-startedAt)/1000):0;
  var html='<div class="rep">'+
    '<div class="repHead"><div><h1>5S Audit Report</h1><div class="muted">Live floor scan</div></div>'+
    '<div class="meta"><div><b>'+esc(who.zone||'')+'</b></div><div>Auditor: '+esc(who.auditor||'')+'</div><div>'+new Date().toLocaleString()+'</div>'+
    '<div>'+scanCount+' scans · '+Math.floor(dur/60)+'m '+(dur%60)+'s</div></div></div>'+
    '<div class="bigScore"><div class="num" style="color:'+(status==='N/A'?'var(--muted)':statusColor(status))+'">'+overall+'<small>%</small></div>'+
    '<div><span class="statusBadge" style="background:'+(status==='N/A'?'#66738a':statusColor(status))+'">'+status+'</span>'+
    '<div class="muted" style="margin-top:8px">Overall 5S score, using applicable categories only.<br>Based on '+scanCount+' scan(s), '+findings.length+' finding(s).</div></div></div>'+
    '<div class="metaRow"><span class="metaPill">Confidence: '+esc(lastConfidence||'—')+'</span>'+
    '<span class="metaPill">Categories judged: '+applicable.length+'/5</span>'+
    '<span class="metaPill">Critical: '+findings.filter(function(f){return f.severity==='critical'}).length+'</span></div>';

  PILLARS.forEach(function(p){
    var c=cs[p]; var f=findings.filter(function(x){return x.pillar===p});
    var disp = c? (c.score!=null? c.score+'/5 · '+c.pct+'%' : c.pct+'% (est.)') : 'N/A';
    var pct = c? c.pct : 0;
    html+='<div class="pillarBlk"><div class="pbar"><span>'+p+'</span><b style="color:'+(c?scCol(pct):'var(--muted)')+'">'+disp+'</b></div>'+
      '<div class="bar"><span style="width:'+pct+'%;background:'+(c?scCol(pct):'#c8d0dd')+'"></span></div>';
    if(f.length){
      f.forEach(function(x){ html+='<div class="finding '+x.severity+'"><span class="tag">'+esc(x.severity)+'</span><div>'+esc(x.finding)+'</div>'+
        (x.location?'<div class="loc">Location: '+esc(x.location)+'</div>':'')+
        (x.evidence?'<div class="muted">'+esc(x.evidence)+'</div>':'')+
        (x.action?'<div class="act">→ '+esc(x.action)+'</div>':'')+'</div>'; });
    } else if(!c){ html+='<div class="muted">Not enough evidence to judge this category.</div>'; }
    else { html+='<div class="none">✓ No issues found</div>'; }
    html+='</div>';
  });

  if(positives.length){ html+='<h3>Good practices observed</h3><ul class="posList">'+positives.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>'; }

  html+='<h3>Management comment</h3><div class="commentBox">'+esc(lastComment||'No comment generated.')+'</div>';

  if(findings.length){
    html+='<h3>Action summary (by priority)</h3><ol class="posList">';
    findings.slice().sort(function(a,b){return sevRank(b.severity)-sevRank(a.severity)}).forEach(function(f){
      html+='<li><b>'+esc(f.pillar)+':</b> '+esc(f.action||('Correct: '+f.finding))+(f.location?' <span class="muted">('+esc(f.location)+')</span>':'')+'</li>';
    });
    html+='</ol>';
  }
  html+='<p class="muted" style="margin-top:20px;border-top:1px solid #dde3ec;padding-top:12px">Generated automatically from camera scanning (confidence: '+esc(lastConfidence||'—')+'). Verify visually before approving actions. Safety or quality risks should be escalated immediately.</p>';
  html+='</div>';

  document.getElementById('reportBody').innerHTML=html;
  lastReport=html;
  var scans=loadJSON(LS.hist,[]);
  scans.push({ts:new Date().toISOString(),auditor:who.auditor||'',zone:who.zone||'',overall:overall,status:status,confidence:lastConfidence,comment:lastComment,findings:findings,positives:positives,scans:scanCount});
  saveJSON(LS.hist,scans);
  screen('report');
}
var lastReport="";
function sevRank(s){return s==='critical'?4:s==='high'?3:s==='medium'?2:1}

function downloadReport(){
  var who=loadJSON(LS.who,{});
  var css=document.querySelector('style').textContent;
  var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>5S Report '+esc(who.zone||'')+'</title><style>'+css+'</style></head><body><div style="padding:16px;background:#eef1f6"><div style="max-width:820px;margin:0 auto">'+lastReport+'</div></div></body></html>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download='5S_report_'+(who.zone||'area').replace(/[^\w-]+/g,'_')+'.html';a.click();
}
function exportCSV(){
  var rows=[["Zone","Auditor","Pillar","Severity","Finding","Location","Evidence","Action"]];
  var who=loadJSON(LS.who,{});
  findings.forEach(function(f){ rows.push([who.zone||'',who.auditor||'',f.pillar,f.severity,f.finding,f.location,f.evidence,f.action]); });
  var csv=rows.map(function(r){return r.map(function(c){var v=c==null?'':String(c);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='5S_findings.csv';a.click();
}

/* init */
(function(){
  var who=loadJSON(LS.who,null);
  if(who){document.getElementById('auditor').value=who.auditor||'';document.getElementById('zone').value=who.zone||''}
  renderBanner();
})();
</script>
