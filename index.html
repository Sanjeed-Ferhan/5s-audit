<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5S Floor Scan</title>
<style>
  :root{--brand:#1f6feb;--bg:#0e1320;--card:#fff;--line:#dde3ec;--txt:#131b2a;--muted:#66738a;
        --good:#12a150;--warn:#dd9b00;--bad:#d63a3a;--shadow:0 8px 24px rgba(0,0,0,.25)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea,select{-webkit-user-select:text;user-select:text}
  img,video{-webkit-user-drag:none}
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  .screen{display:none}
  .screen.on{display:block}
  /* start */
  #scr-start{background:linear-gradient(160deg,#132244,#0e1320);min-height:100vh;color:#fff;padding:26px 18px}
  #scr-start .wrap{max-width:560px;margin:0 auto}
  #scr-start h1{margin:6px 0 4px;font-size:26px}
  #scr-start p.sub{margin:0 0 22px;color:#9fb0cc;font-size:14px;line-height:1.5}
  .card{background:#fff;border-radius:16px;padding:18px;color:var(--txt);box-shadow:var(--shadow);margin-bottom:14px}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.4px}
  input,select{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;font-size:16px;font-family:inherit}
  .btn{width:100%;border:0;border-radius:13px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-cam{background:linear-gradient(135deg,#1f6feb,#0b57d0);color:#fff;padding:22px;font-size:17px}
  .btn-ghost{background:#e8eefb;color:var(--brand)}
  .btn-good{background:var(--good);color:#fff}
  .btn-soft{background:#eef1f6;color:var(--muted)}
  .btn:disabled{opacity:.55}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .hidden{display:none!important}
  .link{color:#8fb4ff;font-weight:700;cursor:pointer;font-size:13px}
  .banner{font-size:12.5px;border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.45;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#16233f;border:1px solid #24365e;color:#a9c0e6}
  .banner a{color:#fff;font-weight:800;text-decoration:underline;cursor:pointer;white-space:nowrap}
  /* camera */
  #scr-scan{position:relative;height:100vh;background:#000;overflow:hidden}
  #video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .overlayTop{position:absolute;top:0;left:0;right:0;padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
    background:linear-gradient(180deg,rgba(0,0,0,.62),transparent);color:#fff;z-index:3}
  .pill{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(18,161,80,.7);animation:pulse 1.6s infinite}
  .dot.off{background:var(--warn);animation:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,161,80,.6)}70%{box-shadow:0 0 0 12px rgba(18,161,80,0)}100%{box-shadow:0 0 0 0 rgba(18,161,80,0)}}
  .scanFrame{position:absolute;inset:12% 9%;border:2px solid rgba(255,255,255,.55);border-radius:18px;z-index:2;pointer-events:none}
  .scanFrame .corner{position:absolute;width:34px;height:34px;border:4px solid #fff}
  .corner.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:16px}
  .corner.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:16px}
  .corner.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:16px}
  .corner.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:16px}
  .scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#5fd0ff,transparent);animation:scan 2.4s linear infinite;z-index:2;pointer-events:none}
  @keyframes scan{0%{top:12%}50%{top:86%}100%{top:12%}}
  .overlayBottom{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 22px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);color:#fff;z-index:3}
  .findToast{background:rgba(12,20,36,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:13px;line-height:1.45;min-height:20px}
  .findToast b{color:#ffd479}
  .countRow{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700}
  .chip.high{background:rgba(214,58,58,.85)}.chip.critical{background:rgba(120,0,0,.95)}.chip.medium{background:rgba(221,155,0,.85)}.chip.low{background:rgba(31,111,235,.85)}
  .ctrls{display:flex;gap:10px}
  .ctrls .btn{padding:15px;font-size:15px}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:sp .75s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* report */
  #scr-report{background:#eef1f6;min-height:100vh;padding:16px}
  #scr-report .wrap{max-width:820px;margin:0 auto}
  .rep{background:#fff;border-radius:16px;padding:26px;box-shadow:var(--shadow);margin-bottom:14px}
  .repHead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:18px;flex-wrap:wrap}
  .repHead h1{margin:0;font-size:22px}
  .repHead .meta{color:var(--muted);font-size:13px;line-height:1.6;text-align:right}
  .bigScore{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:8px 0 18px}
  .bigScore .num{font-size:58px;font-weight:850;line-height:1}
  .bigScore .num small{font-size:22px;font-weight:700;color:var(--muted)}
  .pillarBlk{margin-bottom:18px}
  .pbar{display:flex;justify-content:space-between;font-size:14.5px;font-weight:700;margin-bottom:6px}
  .bar{height:12px;border-radius:7px;background:#e2e8f2;overflow:hidden;margin-bottom:9px}
  .bar>span{display:block;height:100%;border-radius:7px}
  .finding{border-left:4px solid var(--line);padding:8px 12px;margin:8px 0;background:#f8fafc;border-radius:0 8px 8px 0;font-size:13.5px;line-height:1.5}
  .finding.high{border-color:var(--bad)}.finding.critical{border-color:#7a0000;background:#fdecec}.finding.medium{border-color:var(--warn)}.finding.low{border-color:var(--brand)}
  .finding .loc{color:var(--muted);font-size:12px;margin-top:3px}
  .statusBadge{display:inline-block;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:800;color:#fff}
  .metaRow{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
  .metaPill{background:#eef3fb;border:1px solid #d6e2f6;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700;color:#2b4a80}
  .commentBox{background:#f7f9fc;border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;line-height:1.55;margin-top:6px}
  .finding .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .finding .act{color:#0b7a41;margin-top:4px}
  .none{color:var(--good);font-size:13.5px;font-weight:600}
  h3{margin:18px 0 8px;font-size:15px}
  .posList{margin:0;padding-left:20px;font-size:13.5px;line-height:1.7}
  .muted{color:var(--muted);font-size:13px;line-height:1.5}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#0c1424;color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.28s;z-index:999;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media print{
    body{background:#fff}
    #scr-report{padding:0}
    .noPrint{display:none!important}
    .rep{box-shadow:none;border:0;border-radius:0;padding:0 0 14px}
  }
</style>
</head>
<body>

<!-- START -->
<section id="scr-start" class="screen on">
  <div class="wrap">
    <h1>5S Floor Scan</h1>
    <p class="sub">Point your camera at the floor / work area. The AI scans it live, records findings, and builds a 5S report.</p>
    <div id="modeBanner"></div>
    <div class="card">
      <label>Auditor</label>
      <input id="auditor" placeholder="e.g. Sanjeed">
      <label>Zone / Area</label>
      <input id="zone" placeholder="e.g. Line 3 - Packing">
      <label>Scan sensitivity</label>
      <select id="sensitivity">
        <option value="strict">Strict (report every issue)</option>
        <option value="normal" selected>Normal</option>
        <option value="lenient">Lenient (only significant issues)</option>
      </select>
      <div style="height:16px"></div>
      <button class="btn btn-cam" onclick="openCamera()">🎥 Open Camera &amp; Scan</button>
    </div>
    <div class="card">
      <p class="muted" style="margin:0">No camera / desktop? You can still scan a saved photo.</p>
      <div style="height:10px"></div>
      <button class="btn btn-ghost" onclick="document.getElementById('photoInput').click()">Use a photo instead</button>
      <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="scanFromFile(event)">
    </div>
    <div style="text-align:center"><span class="link" onclick="aiSettings()">AI settings</span> &nbsp;·&nbsp; <span class="link" onclick="setSheetUrl()">Google Sheet settings</span></div>
  </div>
</section>

<!-- SCAN -->
<section id="scr-scan" class="screen">
  <video id="video" playsinline autoplay muted></video>
  <div class="scanFrame"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div>
  <div class="scanline" id="scanline"></div>
  <div class="overlayTop">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill"><span class="dot" id="liveDot"></span><span id="scanState">Scanning</span></span>
      <span class="pill" id="modeTag">AI</span>
    </div>
    <div><span class="pill" id="scanCount">0 scans</span></div>
  </div>
  <div class="overlayBottom">
    <div class="countRow" id="countRow"></div>
    <div class="findToast" id="findToast">Starting camera…</div>
    <div class="ctrls">
      <button class="btn btn-ghost" id="autoBtn" onclick="toggleAuto()">Pause</button>
      <button class="btn btn-primary" id="nowBtn" onclick="scanNow()">Scan now</button>
      <button class="btn btn-ghost" id="photoBtn" onclick="capturePhoto()">📷 Photo</button>
      <button class="btn btn-good" onclick="finish()">Finish &amp; Report</button>
    </div>
  </div>
  <input type="file" id="camInput" accept="image/*" capture="environment" class="hidden" onchange="onCamPhoto(event)">
</section>

<!-- REPORT -->
<section id="scr-report" class="screen">
  <div class="wrap">
    <div class="noPrint" style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <button class="btn btn-soft" onclick="resumeScan()">‹ Back to scan</button>
      <button class="btn btn-good" id="sheetBtn" onclick="sendToSheet()">Save to Google Sheet</button>
      <button class="btn btn-primary" onclick="window.print()">Print / Save PDF</button>
      <button class="btn btn-ghost" onclick="downloadReport()">Download report</button>
      <button class="btn btn-ghost" onclick="exportCSV()">Findings CSV</button>
    </div>
    <div id="reportBody"></div>
  </div>
</section>

<div class="toast" id="toast"></div>
